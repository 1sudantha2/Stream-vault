name: Build Stream-Vault APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner has command-line tools installed. Install the exact platform
      # used by compileSdk so the build does not depend on runner image defaults.
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: set -o pipefail; gradle :app:assembleRelease --stacktrace --info 2>&1 | tee build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stream-vault-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-vault-build-log
          path: build.log
          if-no-files-found: warn
